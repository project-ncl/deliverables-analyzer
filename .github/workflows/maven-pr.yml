name: Deliverables Analyzer CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ "*" ]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@461b242bf215856b94e7b40f1ecfa06f7ebb1b45 # v0.0.26
    with:
      upload_artifacts: true
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
