name: Deliverables Analyzer CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ "*" ]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@0fd979fcdd90cf1b62e6410221d64efd6b470865 # v0.0.21
    with:
      upload_artifacts: true
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
